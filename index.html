  function loadState() {

        return { ...defaultState, ...parsed, user: { ...defaultState.user, ...parsed.user } };
      }
    } catch (e) {

    }
    return structuredClone(defaultState);
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error("Failed to save state", e);
    }
  }

  // --- AUDIO SYNTHESIZER FOR SOUNDBOARD & CHAT ---
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) audioCtx = new AudioCtx();
  }

  function playSound(type) {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    
    if (type === "airhorn") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(466.16, now); // Bb4
      osc.frequency.setValueAtTime(466.16, now + 0.1);
      osc.frequency.setValueAtTime(622.25, now + 0.15); // Eb5
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.5);
    } else if (type === "quack") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(150, now + 0.2);
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    } else if (type === "badumtss") {
      // Drum kick + snare simulation
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(120, now);
      osc.frequency.exponentialRampToValueAtTime(0.01, now + 0.15);
      gain.gain.setValueAtTime(0.5, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === "animewow") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.45);
    } else if (type === "ggbell") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(987.77, now); // B5
      gain.gain.setValueAtTime(0.4, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.8);
    } else if (type === "victory") {
      const notes = [440, 554.37, 659.25, 880];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, now + idx * 0.1);
        gain.gain.setValueAtTime(0.2, now + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.1);
        osc.stop(now + idx * 0.1 + 0.25);
      });
    } else if (type === "message") {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.1);
    }

  function parseMarkdown(text) {
    let raw = esc(text);
    // Bold
    raw = raw.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    // Italics
    raw = raw.replace(/\*(.*?)\*/g, '<em>$1</em>');
    // Code inline
    raw = raw.replace(/`([^`]+)`/g, '<code class="bg-[#1e1f22] text-[#e2e4e9] px-1.5 py-0.5 rounded font-mono text-xs">$1</code>');
    // Code block
    raw = raw.replace(/```(.*?)\n([\s\S]*?)```/g, '<pre class="bg-[#1e1f22] border border-[#2b2d31] p-3 rounded-lg text-xs font-mono text-[#4717f6] overflow-x-auto my-2"><code>$2</code></pre>');
    // Spoilers ||text||
    raw = raw.replace(/\|\|(.*?)\|\|/g, '<span class="spoiler" onclick="this.classList.toggle(\'revealed\')">$1</span>');
    // User mentions @NitroBot
    raw = raw.replace(/@([a-zA-Z0-9_]+)/g, '<span class="bg-[#5865F2]/20 text-[#c9cdfb] font-semibold px-1 py-0.5 rounded hover:bg-[#5865F2] hover:text-white transition">@$1</span>');

  // --- EVENT BINDING ENGINE ---
  function bindEvents() {
    // Action clicks
    document.querySelectorAll("[data-action]").forEach(el => {
      el.onclick = (e) => handleAction(el.dataset.action, el, e);
    });

    // Chat enter keyboard shortcut
    const chatInput = document.getElementById("chat-input");
    if (chatInput) {
      chatInput.onkeydown = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      };
    }
  }

  function handleAction(action, el, e) {
    switch (action) {
      case 'select-server':
        state.currentServer = parseInt(el.dataset.idx);
        state.currentChannel = 0;
        state.activeView = 'chat';
        saveState();
        render();
        break;

      case 'select-channel':
        state.currentChannel = parseInt(el.dataset.idx);
        state.activeView = 'chat';
        saveState();
        render();
        scrollToBottom();
        break;

      case 'nav-dm':
      case 'nav-friends':
        state.activeView = 'friends';
        saveState();
        render();
        break;

      case 'nav-nitro':
        state.activeView = 'nitro';
        saveState();
        render();
        break;

      case 'nav-shop':
        state.activeView = 'shop';
        saveState();
        render();
        break;

      case 'nav-settings':
        state.activeView = 'settings';
        saveState();
        render();
        break;

      case 'send-msg':
        sendMessage();
        break;

      case 'toggle-mute':
        state.user.muted = !state.user.muted;
        showToast(state.user.muted ? "Microphone Muted" : "Microphone Unmuted", "🎙️");
        saveState();
        render();
        break;

      case 'toggle-deafen':
        state.user.deafened = !state.user.deafened;
        showToast(state.user.deafened ? "Deafened Audio" : "Undeafened Audio", "🎧");
        saveState();
        render();
        break;

      case 'play-sound':
        playSound(el.dataset.sound);
        showToast(`Playing ${el.dataset.sound} soundboard effect!`, "🔊");
        break;

      case 'set-decor':
        state.user.decor = el.dataset.decor;
        saveState();
        render();
        showToast("Equipped Avatar Decoration!", "✨");
        break;

      case 'set-effect':
        state.user.effect = el.dataset.effect;
        saveState();
        render();
        showToast("Equipped Profile Background Effect!", "🌸");
        break;

      case 'set-theme':
        state.user.theme = el.dataset.theme;
        saveState();
        render();
        showToast(`Theme updated to ${el.dataset.theme.toUpperCase()}`, "🎨");
        break;

      case 'save-profile':
        const nameVal = document.getElementById("setting-username").value.trim();
        const avaVal = document.getElementById("setting-avatar").value.trim();
        const bioVal = document.getElementById("setting-bio").value.trim();
        if (nameVal) state.user.username = nameVal;
        if (avaVal) state.user.avatar = avaVal;
        state.user.bio = bioVal;
        saveState();
        render();
        showToast("Profile details updated!", "✅");
        break;

      case 'boost-server':
        const srv = getCurrentServer();
        srv.boosts++;
        if (srv.boosts >= 14) srv.boostLevel = 3;
        else if (srv.boosts >= 7) srv.boostLevel = 2;
        saveState();
        playSound("victory");
        render();
        showToast(`Server boosted! Total Boosts: ${srv.boosts}`, "🚀");
        break;

      case 'toggle-members':
        state.memberListOpen = !state.memberListOpen;
        render();
        break;

      case 'join-voice':
        state.inVoiceCall = true;
        state.currentVoiceChannel = el.dataset.name;
        playSound("message");
        render();
        showToast(`Connected to ${el.dataset.name}`, "🔊");
        break;

      case 'disconnect-voice':
        state.inVoiceCall = false;
        state.currentVoiceChannel = null;
        render();
        showToast("Disconnected from Voice Room", "✖");
        break;

      case 'reset-data':
        if (confirm("Reset all custom messages and settings to default?")) {
          localStorage.removeItem(STORAGE_KEY);
          state = structuredClone(defaultState);
          render();
          showToast("Data restored to factory defaults", "🔄");
        }
        break;
    }
  }

  function sendMessage() {
    const input = document.getElementById("chat-input");
    if (!input) return;
    const val = input.value.trim();
    if (!val) return;

    const msgs = getMessages();
    const newMsg = {
      id: "m_" + Date.now(),
      user: state.user.username,
      avatar: state.user.avatar,
      bot: false,
      text: val,
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      reactions: []
    };

    msgs.push(newMsg);
    input.value = "";
    saveState();
    playSound("message");
    render();
    scrollToBottom();

    // Trigger AI / Demo Bot replies
    triggerBotResponse(val);
  }

  // --- INITIALIZE APP ---
  render();
})();
</script>
